<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Produits - MongoDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
<link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .btn-gradient { background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; }
        .btn-gradient:hover { background: linear-gradient(45deg, #764ba2, #667eea); }
        
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <!-- En-tête -->
                <div class="text-center mb-5">
                    <h1 class="text-white"><i class="bi bi-database"></i> Gestion Produits</h1>
                    <p class="text-light">Application Full-Stack avec MongoDB</p>
                </div>

                <!-- Formulaire -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h4 id="formTitle" class="card-title">
                            <i class="bi bi-plus-circle"></i> Ajouter un produit
                        </h4>
                        <form id="productForm">
                            <input type="hidden" id="productId">
                            
                            <div class="mb-3">
                                <label class="form-label">Nom du produit</label>
                                <input type="text" id="name" class="form-control" placeholder="iPhone 15" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Prix ($)</label>
                                <input type="number" id="price" class="form-control" placeholder="999" step="0.01" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Catégorie</label>
                                <select id="category" class="form-select" required aria-label="Sélectionnez une catégorie">
    <option value="" selected disabled>Choisir une catégorie</option>
    <option value="Électronique">Électronique</option>
    <option value="Vêtements">Vêtements</option>
    <option value="Alimentation">Alimentation</option>
    <option value="Maison">Maison</option>
    <option value="Autre">Autre</option>
</select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" id="stock" class="form-control" placeholder="50" required>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-gradient">
                                    <i class="bi bi-check-circle"></i> Enregistrer
                                </button>



                                <button type="button" id="cancelBtn" class="btn btn-secondary d-none">



                                    <i class="bi bi-x-circle"></i> Annuler
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Liste des produits -->
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">
                            <i class="bi bi-list-ul"></i> Liste des produits
                            <span id="productCount" class="badge bg-primary ms-2">0</span>
                        </h4>
                        <div id="productList" class="mt-3">
                            <!-- Les produits apparaîtront ici -->
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="text-center mt-4 text-white">
                    <p><i class="bi bi-database-check"></i> Connecté à MongoDB</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
